<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Номерной — крути номера со всего мира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Oswald:wght@600&family=Manrope:wght@400;600;800&family=Dancing+Script:wght@700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1013;
    --panel: #171a1f;
    --panel-2: #1f232a;
    --line: #2a2f37;
    --text: #e9ecf1;
    --muted: #8a93a0;
    --accent: #ffd500;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Manrope, system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 500px at 50% -200px, #1d2430 0%, transparent 70%),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.015) 46px 48px),
      var(--bg);
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; border: 0; }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 20px 60px; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14,16,19,.88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  header .wrap { display: flex; align-items: center; gap: 16px; padding-top: 14px; padding-bottom: 14px; }
  .logo { font-family: Oswald; font-weight: 600; font-size: 26px; letter-spacing: .04em; display: flex; align-items: center; gap: 10px; }
  .logo .plate { font-size: 13px; }
  nav { display: flex; gap: 6px; margin-left: 12px; }
  nav button { background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
  nav button.on { background: var(--panel-2); color: var(--text); }
  nav .count { color: var(--accent); margin-left: 4px; }
  .balance {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px;
    font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .balance small { color: var(--muted); font-weight: 600; font-size: 12px; }
  .balance.flash { animation: flash .6s; }
  @keyframes flash { 30% { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,213,0,.15); } }
  .help-btn { background: var(--accent); color: #111; font-weight: 800; padding: 6px 10px; border-radius: 7px; font-size: 13px; }

  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 34px 0 14px; }

  /* ---------- номер: общее ---------- */
  .plate {
    display: inline-flex; align-items: stretch; vertical-align: middle; flex: none;
    height: 2.1em; background: #f7f7f2; color: #121212;
    border: .09em solid #121212; border-radius: .22em;
    box-shadow: inset 0 0 0 .06em #f7f7f2, inset 0 0 0 .1em #121212, 0 .15em .4em rgba(0,0,0,.45);
    overflow: hidden; user-select: none;
  }
  .plate .chars {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 0 .3em; font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
    font-size: 1.55em; letter-spacing: .04em; white-space: nowrap; line-height: 1.1;
  }
  .ch, .reel { display: inline-block; height: 1.1em; line-height: 1.1em; }
  .sp { display: inline-block; width: .28em; }
  .reel { position: relative; overflow: hidden; }
  .reel .fin { visibility: hidden; }
  .reel .col { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
  .reel .col span { display: block; height: 1.1em; text-align: center; }
  .row { display: flex; align-items: center; justify-content: center; }

  /* левая синяя полоса (ЕС / Украина / UK) */
  .strip {
    width: .95em; flex: none; background: #0a3d91;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: .25em 0 .14em;
  }
  .strip .stars { width: .62em; height: .62em; }
  .strip .uaflag { width: .6em; height: .4em; margin-top: .06em; background: linear-gradient(#0057b7 50%, #ffd500 50%); box-shadow: 0 0 0 .04em #fff; }
  .plate .strip b { color: #fff; font-family: Manrope; font-size: .36em; font-weight: 800; }
  .side {
    width: .95em; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: .2em 0; font-family: Manrope; font-weight: 800;
  }
  .plate .side b { font-size: .34em; color: inherit; }
  .side.pt { background: #f2c200; color: #111; }
  .side.fr, .side.it { background: #0a3d91; color: #fff; }
  .side.fr i { width: .5em; height: .5em; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #ffd500, #e2561d); }
  .side.it i { width: .5em; height: .5em; border-radius: 50%; border: .06em solid #ffd500; }

  .plate.yellow { background: #f5c400; box-shadow: inset 0 0 0 .06em #f5c400, inset 0 0 0 .1em #121212, 0 .15em .4em rgba(0,0,0,.45); }
  .plate.uk .chars { font-weight: 700; letter-spacing: .02em; }
  .stick { display: inline-flex; flex-direction: column; gap: .05em; margin: 0 .1em; vertical-align: middle; }
  .stick i { width: .3em; height: .3em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f3e3a0, #c49b2c); }
  .stick i + i { background: radial-gradient(circle at 35% 35%, #d9e2f0, #6e86b3); }

  /* Калифорния */
  .plate.ca {
    flex-direction: column; height: 3.5em; padding: .12em .45em .1em; align-items: center;
    background: linear-gradient(#fdfdfd, #e9eef5); color: #1c2a6b; border: .06em solid #8892a3; border-radius: .3em;
    box-shadow: 0 .15em .4em rgba(0,0,0,.45);
  }
  .plate.ca .state { font-family: 'Dancing Script', cursive; color: #c8102e; font-size: .9em; line-height: 1; }
  .plate.ca .chars { font-size: 1.85em; padding: 0; font-weight: 600; flex: 1; }
  .plate.ca .dmv { font-size: .28em; font-weight: 800; letter-spacing: .1em; color: #1c2a6b; text-transform: uppercase; font-family: Manrope; }

  /* Япония */
  .plate.jp {
    flex-direction: column; justify-content: center; height: 3.4em; padding: .1em .45em;
    background: #fbfbf4; color: #0b6b3a; border: .11em solid #0b6b3a; border-radius: .28em;
    box-shadow: inset 0 0 0 .05em #fbfbf4, 0 .15em .4em rgba(0,0,0,.45);
  }
  .plate.jp .chars { flex-direction: column; font-family: 'Barlow Condensed', 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-weight: 700; padding: 0; font-size: 1em; letter-spacing: .02em; }
  .plate.jp .row:first-child { font-size: .62em; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; gap: .3em; }
  .plate.jp .row:last-child { font-size: 1.75em; }
  .plate.jp .row:last-child > :first-child { font-size: .42em; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; margin-right: .25em; }

  /* Дубай */
  .plate.ae .emirate {
    flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 .3em; border-right: .05em solid #121212; background: #c8102e; color: #fff;
  }
  .plate.ae .emirate b { font-size: .55em; line-height: 1; }
  .plate.ae .emirate small { font-family: Manrope; font-weight: 800; font-size: .3em; letter-spacing: .08em; }
  .plate.ae .chars { font-weight: 700; }

  /* ---------- выбор страны ---------- */
  .countries { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-top: 24px; }
  .country {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text);
    transition: border-color .15s, transform .15s;
  }
  .country:hover:not(:disabled) { border-color: #3a414c; transform: translateY(-2px); }
  .country.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,213,0,.12); }
  .country:disabled { opacity: .5; cursor: not-allowed; }
  .country .pv { width: 100%; height: 68px; display: flex; align-items: center; justify-content: center; }
  .country b { font-size: 14px; }
  .country small { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- сцена ---------- */
  .stage {
    margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 40px 20px 28px; text-align: center; position: relative; overflow: hidden;
  }
  .stage::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(500px 220px at 50% 38%, color-mix(in srgb, var(--c, transparent) 30%, transparent), transparent 70%);
    transition: background .4s;
  }
  .stage .title { color: var(--muted); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 26px; position: relative; }
  .big { min-height: 280px; display: flex; align-items: center; justify-content: center; position: relative; }
  .big .plate { transition: box-shadow .4s; }
  .big.won .plate { box-shadow: 0 0 0 .08em var(--panel), 0 0 .9em color-mix(in srgb, var(--c) 80%, transparent); }
  .outcome { min-height: 92px; margin-top: 22px; position: relative; }
  .outcome .tier { color: var(--c); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; animation: rise .4s cubic-bezier(.2,.9,.3,1.2); }
  .outcome .meta { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .outcome .val { font-size: 30px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; animation: rise .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.95); } }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; position: relative; }
  .btn { padding: 12px 20px; border-radius: 10px; font-weight: 800; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .btn:hover { border-color: #3a414c; }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.spin { font-size: 18px; padding: 15px 42px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .kbd { color: var(--muted); font-size: 13px; margin-top: 12px; position: relative; }
  .kbd b { color: var(--accent); }
  @media (hover: none) { .kbd .key { display: none; } }

  /* ---------- шансы ---------- */
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .legend > div {
    display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--c); border-radius: 10px; padding: 12px 14px;
  }
  .legend .pv { flex: 0 0 48%; display: flex; justify-content: center; }
  .legend b { color: var(--c); display: block; font-size: 13px; }
  .legend small { color: var(--muted); font-size: 12px; display: block; }

  /* ---------- гараж ---------- */
  .inv-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 24px 0 14px; }
  .inv-bar .total { font-weight: 800; }
  .inv-bar .total small { color: var(--muted); font-weight: 600; }
  .inv-bar select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 10px 12px; border-radius: 10px; font: inherit;
  }
  .inv-bar select:first-of-type { margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .item {
    background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--c) 12%, var(--panel)));
    border: 1px solid var(--line); border-bottom: 3px solid var(--c); border-radius: 12px; padding: 16px 14px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .item .pv { min-height: 90px; display: flex; align-items: center; justify-content: center; }
  .item .info { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; }
  .item .tier { color: var(--c); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
  .item .region { color: var(--muted); text-align: right; }
  .item .foot { display: flex; align-items: center; justify-content: space-between; }
  .item .price { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
  .item .btn { padding: 8px 14px; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; border: 1px dashed var(--line); border-radius: 14px; grid-column: 1 / -1; }

  .item.sel { outline: 3px solid var(--accent); outline-offset: -1px; }
  .item.dim { opacity: .35; }
  .item.pick { cursor: pointer; }
  .item .listed { color: var(--accent); font-size: 12px; font-weight: 700; }
  .item .seller { color: var(--muted); font-size: 12px; }
  .item .seller button { background: none; color: var(--text); font-weight: 700; padding: 0; text-decoration: underline; text-decoration-color: #4a515c; }
  .item form { display: flex; gap: 6px; }
  .item input { width: 100%; min-width: 0; }

  input.field {
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-variant-numeric: tabular-nums;
  }
  input.field:focus { outline: none; border-color: var(--accent); }

  .hidden { display: none !important; }

  /* ---------- бонусы ---------- */
  .perks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .perk {
    display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
  }
  .perk .ico { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center; font-weight: 800; color: #111; }
  .perk .txt { flex: 1; min-width: 0; }
  .perk b { display: block; font-size: 14px; }
  .perk small { color: var(--muted); font-size: 12px; }
  .perk .btn { padding: 9px 14px; font-size: 13px; flex: none; }

  /* ---------- шапка: аккаунт ---------- */
  .acc {
    display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 10px; color: var(--text); font-weight: 700; max-width: 180px;
  }
  .acc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .acc.member i { background: #3ccf7a; }
  .badge { background: #ff3d3d; color: #fff; border-radius: 9px; font-size: 11px; padding: 1px 6px; margin-left: 4px; font-weight: 800; }

  /* ---------- модалка и уведомления ---------- */
  .modal { position: fixed; inset: 0; z-index: 30; background: rgba(5,6,8,.7); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; }
  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(760px, 100%);
    max-height: calc(100vh - 40px); overflow: auto; padding: 22px; position: relative;
  }
  .sheet h3 { margin: 0 0 6px; font-family: Oswald; font-weight: 600; font-size: 24px; }
  .sheet p { color: var(--muted); margin: 0 0 16px; font-size: 14px; line-height: 1.5; }
  .sheet .x { position: absolute; top: 12px; right: 12px; background: var(--panel-2); color: var(--text); width: 34px; height: 34px; border-radius: 9px; font-size: 18px; }
  .sheet .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .sheet .row2 .field { flex: 1; min-width: 160px; }
  .login { display: grid; gap: 10px; margin-top: 8px; }
  .login .btn { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .login .note { color: var(--muted); font-size: 12px; text-align: center; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cols h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .mini { display: grid; gap: 8px; max-height: 320px; overflow: auto; padding-right: 4px; }
  .mini .m {
    display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line);
    border-left: 3px solid var(--c); border-radius: 9px; padding: 8px 10px; cursor: pointer; text-align: left; color: var(--text);
  }
  .mini .m.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel-2)); }
  .mini .m .pv { flex: 0 0 55%; display: flex; }
  .mini .m small { color: var(--muted); display: block; font-size: 11px; }
  .toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 40; display: grid; gap: 8px; width: min(420px, calc(100% - 24px)); }
  .toast { background: #252a32; border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); border-radius: 10px; padding: 12px 14px; font-size: 14px; animation: rise .3s; }

  /* ---------- игроки и обмены ---------- */
  .board { display: grid; gap: 6px; }
  .board button {
    display: grid; grid-template-columns: 36px 1fr auto auto; gap: 12px; align-items: center; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--text);
  }
  .board button.me { border-color: var(--accent); }
  .board .rank { color: var(--muted); font-weight: 800; }
  .board .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board small { color: var(--muted); }
  .board .w { font-weight: 800; font-variant-numeric: tabular-nums; }
  .offer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
  .offer .who { font-size: 14px; }
  .offer .who b { color: var(--accent); }
  .offer .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .offer .oside h5 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .offer .oside .pv { margin-bottom: 6px; display: flex; }
  .offer .money { font-weight: 800; }
  .offer .gone { color: #ff6b6b; font-size: 12px; }
  .offers { display: grid; gap: 10px; }

  /* ---------- коллекции ---------- */
  .colls { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 24px; }
  .coll { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .coll.done { border-color: color-mix(in srgb, #3ccf7a 60%, var(--line)); }
  .coll h4 { margin: 0; font-size: 17px; }
  .coll p { margin: 0; color: var(--muted); font-size: 13px; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .coll .foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .coll .foot b { font-variant-numeric: tabular-nums; }
  .coll .btn { padding: 8px 14px; font-size: 13px; }
  .coll .got { color: #3ccf7a; font-weight: 800; }

  .contract-bar {
    position: sticky; top: 72px; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: #22262d; border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
  }
  .contract-bar .txt { flex: 1; min-width: 200px; font-size: 14px; }
  .contract-bar small { color: var(--muted); display: block; }

  /* барабаны в ожидании ответа сервера */
  .reel .col.loop { animation: loop calc(var(--n) * 45ms) linear infinite; }
  @keyframes loop { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(calc(var(--n) * -1.1em)); } }

  .loading { color: var(--muted); text-align: center; padding: 40px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 12px 40px; }
    header .wrap { gap: 8px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
    .logo { display: none; }
    nav { order: 3; width: 100%; margin: 0 -12px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button { padding: 8px 12px; white-space: nowrap; }
    .balance { font-size: 16px; padding: 7px 10px; margin-left: 0; }
    .balance small { display: none; }
    .acc { margin-left: auto; max-width: 150px; }
    .perks { grid-template-columns: 1fr; margin-top: 12px; }
    /* страны — горизонтальная лента со свайпом */
    .countries {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px;
      margin: 12px -12px 0; padding: 2px 12px 6px; scrollbar-width: none;
    }
    .countries::-webkit-scrollbar { display: none; }
    .country { flex: 0 0 148px; scroll-snap-align: start; padding: 10px 8px 8px; gap: 4px; }
    .country .pv { height: 54px; }
    .country b { font-size: 13px; }
    .stage { margin-top: 12px; padding: 22px 12px 18px; border-radius: 14px; }
    .stage .title { margin-bottom: 10px; }
    .big { min-height: 170px; }
    .outcome { margin-top: 12px; min-height: 84px; }
    .actions { flex-direction: column; }
    .actions .btn { width: 100%; }
    .legend { grid-template-columns: 1fr; }
    .inv-bar .total { width: 100%; }
    .inv-bar .btn, .inv-bar select { flex: 1 1 40%; min-width: 0; }

</style>
</head>
<body>
<header>

<div class="modal hidden" id="modal"><div class="sheet"><button class="x" id="modalX">×</button><div id="modalBody"></div></div></div>
<div class="toasts" id="toasts"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {
  COUNTRIES, TIERS, COLLECTIONS, AZ, KANA, DIGITS, PITY, RENT_RATE, RENT_CAP_H, MARKET_FEE, RARE_IDX,
  countryOf, tierOf, tierIdx, tierChance, spinPrice, makePlate, regionName, collectionProgress, pick,
} from './supabase/functions/_shared/plates.js';

const SUPABASE_URL = 'https://ijacsixgtvhhivpxnmzg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ezkhmcasU6NAdMwImnmUdg_hji3h9cZ'; // публичный ключ, его можно светить
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- утилиты ----------
const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString('ru-RU') + ' ₴';
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const hash = s => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many; };
const kyivDate = d => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Kyiv' }).format(d);

function toast(msg, color) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  if (color) el.style.setProperty('--c', color);
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 4200);
}
async function rpc(name, args = {}) {
  const { data, error } = await sb.rpc(name, args);
  if (error) throw new Error(error.message);
  return data;
}
async function callFn(name, body) {
  const { data, error } = await sb.functions.invoke(name, { body });
  if (error) {
    const msg = await error.context?.json?.().then(j => j.error).catch(() => null);
    throw new Error(msg || 'Сервер не ответил, попробуй ещё раз');
  }
  return data;
}
// Обёртка для кнопок: ошибки показываем уведомлением
const act = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, '#ff3d3d'); } };

// ---------- рамки номеров ----------
const STARS = `<svg class="stars" viewBox="0 0 20 20">${Array.from({ length: 12 }, (_, i) => {
  const a = i * Math.PI / 6;
  return `<circle cx="${(10 + 7.2 * Math.sin(a)).toFixed(2)}" cy="${(10 - 7.2 * Math.cos(a)).toFixed(2)}" r="1.25" fill="#ffd500"/>`;
}).join('')}</svg>`;
const euStrip = code => `<span class="strip">${STARS}<b>${code}</b></span>`;
const FR_DEPTS = ['75', '13', '69', '06', '33', '59', '31', '67', '44', '92', '974', '2A'];
const IT_PROV = ['RM', 'MI', 'NA', 'TO', 'FI', 'VE', 'BO', 'PA', 'GE', 'BA'];
const FRAMES = {
  ua: inner => `<span class="plate"><span class="strip"><span class="uaflag"></span><b>UA</b></span><span class="chars">${inner}</span></span>`,
  pl: inner => `<span class="plate">${euStrip('PL')}<span class="chars">${inner}</span></span>`,
  pt: (inner, t) => `<span class="plate">${euStrip('P')}<span class="chars">${inner}</span><span class="side pt"><b>${20 + hash(t) % 7}</b><b>${String(1 + hash(t) % 12).padStart(2, '0')}</b></span></span>`,
  nl: inner => `<span class="plate yellow">${euStrip('NL')}<span class="chars">${inner}</span></span>`,
  it: (inner, t) => `<span class="plate">${euStrip('I')}<span class="chars">${inner}</span><span class="side it"><i></i><b>${IT_PROV[hash(t) % IT_PROV.length]}</b></span></span>`,
  fr: (inner, t) => `<span class="plate">${euStrip('F')}<span class="chars">${inner}</span><span class="side fr"><i></i><b>${FR_DEPTS[hash(t) % FR_DEPTS.length]}</b></span></span>`,
  de: inner => `<span class="plate">${euStrip('D')}<span class="chars">${inner}</span></span>`,
  uk: inner => `<span class="plate yellow uk">${euStrip('UK')}<span class="chars">${inner}</span></span>`,
  us: inner => `<span class="plate ca"><span class="state">California</span><span class="chars">${inner}</span><span class="dmv">dmv.ca.gov</span></span>`,
  jp: inner => `<span class="plate jp"><span class="chars">${inner}</span></span>`,
  ae: inner => `<span class="plate ae"><span class="emirate"><b>دبي</b><small>DUBAI</small></span><span class="chars">${inner}</span></span>`,
};

// Разбиваем текст на ячейки: цифры, буквы, кана и блоки кандзи крутятся, остальное статично.
function cells(c, text) {
  const out = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (/[一-鿿]/.test(ch)) {
      let j = i; while (j < text.length && /[一-鿿]/.test(text[j])) j++;
      out.push({ v: text.slice(i, j), pool: c.regionCodes }); i = j - 1;
    } else if (/\d/.test(ch)) out.push({ v: ch, pool: DIGITS });
    else if (/[A-Z]/.test(ch)) out.push({ v: ch, pool: c.letters });
    else if (/[぀-ゟ]/.test(ch)) out.push({ v: ch, pool: KANA });
    else out.push({ v: ch });
  }
  return out;
}
// mode: false — статичный номер, 'spin' — барабаны до финального символа, 'loop' — бесконечное вращение
function cellHTML(cell, mode, idx) {
  if (cell.v === ' ') return '<span class="sp"></span>';
  if (cell.v === '•') return '<span class="stick"><i></i><i></i></span>';
  if (!mode || !cell.pool) return `<span class="ch">${cell.v}</span>`;
  const pool = [...cell.pool];
  if (mode === 'loop') {
    const items = Array.from({ length: 8 }, () => pick(pool));
    return `<span class="reel"><span class="fin">${cell.v}</span><span class="col loop" style="--n:${items.length};animation-delay:-${idx * 70}ms">${[...items, ...items].map(x => `<span>${x}</span>`).join('')}</span></span>`;
  }
  const len = 14 + idx * 3;
  const items = Array.from({ length: len }, () => pick(pool));
  items.push(cell.v, pick(pool)); // лишний символ снизу — на случай отскока
  return `<span class="reel"><span class="fin">${cell.v}</span><span class="col" data-len="${len}">${items.map(x => `<span>${x}</span>`).join('')}</span></span>`;
}
function plateHTML(cId, text, mode = false) {
  const c = countryOf(cId);
  let idx = 0;
  const rows = text.split('|').map(row =>
    `<span class="row">${cells(c, row).map(cell => cellHTML(cell, mode, cell.pool ? idx++ : idx)).join('')}</span>`);
  return FRAMES[cId](rows.join(''), text);
}
// Номер максимально крупный, но не шире своего контейнера
function fit(root = document) {
  root.querySelectorAll('.fit').forEach(box => {
    const plate = box.querySelector('.plate');
    if (!plate || !box.clientWidth) return;
    const base = +box.dataset.size;
    plate.style.fontSize = base + 'px';
    // высокие номера (Калифорния, Япония) ограничиваем ещё и по высоте
    const k = Math.min(1, (box.clientWidth - 4) / plate.offsetWidth, base * 2.8 / plate.offsetHeight);
    if (k < 1) plate.style.fontSize = Math.floor(base * k) + 'px';
  });
}
const plateBox = (p, size) => `<div class="pv fit" data-size="${size}">${plateHTML(p.c, p.text)}</div>`;

// ---------- состояние ----------
const S = {
  uid: null, member: false, provider: '', profile: null,
  plates: [], listed: new Map(), claims: new Set(), offers: [],
  country: localStorage.getItem('nomernoy-country') || 'ua',
  spinning: false, lastItem: null, contract: null, listing: null,
  google: false, tgBot: null, market: [], board: [],
};
if (!countryOf(S.country)) S.country = 'ua';
const EXAMPLES = Object.fromEntries(COUNTRIES.map(c => [c.id, TIERS.map(t => makePlate(c, t.id))]));
const toItem = r => ({ id: r.id, c: r.country, text: r.text, tier: r.tier, value: r.value, ts: Date.parse(r.created_at), owner: r.owner });
const worth = () => S.plates.reduce((s, p) => s + p.value, 0);

async function loadMe() {
  const [prof, plates, listed, claims, offers] = await Promise.all([
    sb.from('profiles').select('*').eq('id', S.uid).single(),
    sb.from('plates').select('*').eq('owner', S.uid),
    sb.from('listings').select('plate_id, price').eq('seller', S.uid),
    sb.from('claims').select('collection'),
    sb.from('offers').select('*').eq('status', 'open').order('created_at', { ascending: false }),
  ]);
  if (prof.error) throw new Error(prof.error.message);
  S.profile = prof.data;
  S.plates = (plates.data || []).map(toItem);
  S.listed = new Map((listed.data || []).map(l => [l.plate_id, l.price]));
  S.claims = new Set((claims.data || []).map(c => c.collection));
  S.offers = offers.data || [];
}

// ---------- шапка, бонусы ----------
function renderHeader(flash) {
  $('#balanceVal').textContent = S.profile ? fmt(S.profile.balance) : '…';
  $('#accNick').textContent = S.profile ? S.profile.nick : '…';
  $('#accBtn').classList.toggle('member', S.member);
  $('#accBtn').title = S.member ? 'Аккаунт' : 'Гость — войди, чтобы торговать';
  const incoming = S.offers.filter(o => o.to_id === S.uid).length;
  $('#offerBadge').innerHTML = incoming ? `<span class="badge">${incoming}</span>` : '';
  const ready = COLLECTIONS.filter(c => !S.claims.has(c.id) && isComplete(c.id)).length;
  $('#collBadge').innerHTML = ready ? `<span class="badge">${ready}</span>` : '';
  if (flash) { const b = $('#balance'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }
}

function dailyState() {
  const p = S.profile;
  const today = kyivDate(new Date());
  const yesterday = kyivDate(new Date(Date.now() - 864e5));
  const streak = p.daily_last === yesterday ? p.daily_streak + 1 : 1;
  return { available: p.daily_last !== today, streak, amount: Math.min(500 + (streak - 1) * 250, 2000) };
}
function rentNow() {
  const p = S.profile;
  const hours = Math.min((Date.now() - Date.parse(p.rent_at)) / 36e5, RENT_CAP_H);
  return p.rent_pending + Math.floor(worth() * RENT_RATE * Math.max(0, hours));
}
function renderPerks() {
  if (!S.profile) return;
  const d = dailyState();
  $('#dailyTitle').textContent = d.available ? `Ежедневный бонус · +${fmt(d.amount)}` : 'Бонус получен';
  $('#dailyText').textContent = d.available
    ? `День ${d.streak} подряд. Заходи каждый день — бонус растёт до 2 000 ₴`
    : `Серия: ${S.profile.daily_streak} дн. Следующий — завтра, +${fmt(Math.min(500 + S.profile.daily_streak * 250, 2000))}`;
  $('#dailyBtn').classList.toggle('hidden', !d.available);
  const r = rentNow();
  const perHour = Math.floor(worth() * RENT_RATE);
  $('#rentTitle').textContent = `Аренда гаража · +${fmt(r)}`;
  $('#rentText').textContent = perHour
    ? `Номера приносят ${fmt(perHour)} в час, копится до ${RENT_CAP_H} ч`
    : 'Номера в гараже приносят 0,5% своей цены в час';
  $('#rentBtn').disabled = r < 1;
}

// ---------- крутилка ----------
function renderCountries() {
  $('#countries').innerHTML = COUNTRIES.map(c => `
    <button class="country ${c.id === S.country ? 'on' : ''}" data-country="${c.id}" ${S.spinning ? 'disabled' : ''}>
      <span class="pv fit" data-size="15">${plateHTML(c.id, EXAMPLES[c.id][4])}</span>
      <b>${c.name}</b><small>${fmt(spinPrice(c))}</small>
    </button>`).join('');
  fit($('#countries'));
}
function renderSpinButton() {
  const price = spinPrice(countryOf(S.country));
  $('#spinBtn').textContent = S.spinning ? 'Крутится…' : `Крутить · ${fmt(price)}`;
  $('#spinBtn').disabled = S.spinning || !S.profile || S.profile.balance < price;
  const left = PITY - (S.profile?.pity || 0);
  $('#pity').innerHTML = left <= 1 ? '<b>Следующая прокрутка — минимум редкий</b>' : `Гарант редкого через ${left}`;
}
function renderStage() {
  const c = countryOf(S.country);
  $('#stageTitle').textContent = c.name;
  $('#stage').style.removeProperty('--c');
  $('#big').classList.remove('won');
  $('#big').innerHTML = plateHTML(c.id, EXAMPLES[c.id][0]);
  $('#outcome').innerHTML = '';
  $('#sellNow').classList.add('hidden');
  renderSpinButton();
  fit($('#stage'));
}
function renderLegend() {
  const c = countryOf(S.country);
  $('#legendTitle').textContent = `Шансы · ${c.name}`;
  $('#legend').innerHTML = TIERS.map((t, i) => `
    <div style="--c:${t.color}">
      <span class="pv fit" data-size="17">${plateHTML(c.id, EXAMPLES[c.id][i])}</span>
      <div><b>${t.name} · ${(tierChance(t) * 100).toFixed(t.weight < 1 ? 2 : 1)}%</b>
      <small>${fmt(Math.round(t.min * c.mult))} – ${fmt(Math.round(t.max * c.mult))}</small>
      <small>${t.rule}</small></div>
    </div>`).join('');
  fit($('#legend'));
}

const spin = act(async () => {
  const c = countryOf(S.country);
  if (S.spinning || !S.profile || S.profile.balance < spinPrice(c)) return;
  S.spinning = true;
  renderSpinButton(); renderCountries();
  $('#stage').style.removeProperty('--c');
  $('#big').classList.remove('won');
  $('#outcome').innerHTML = '';
  $('#sellNow').classList.add('hidden');
  $('#big').innerHTML = plateHTML(c.id, makePlate(c, 'common'), 'loop');
  fit($('#stage'));

  let res;
  try { res = await callFn('spin', { country: c.id }); }
  catch (e) { S.spinning = false; renderStage(); renderCountries(); throw e; }

  const item = { ...res.item, ts: Date.now() };
  S.profile.balance = res.balance;
  S.profile.pity = tierIdx(item.tier) >= RARE_IDX ? 0 : S.profile.pity + 1;
  renderHeader();
  $('#big').innerHTML = plateHTML(c.id, item.text, 'spin');
  fit($('#stage'));
  const cols = [...document.querySelectorAll('#big .col')];
  void $('#big').offsetWidth;
  cols.forEach((col, i) => {
    col.style.transition = `transform ${0.9 + i * 0.2}s cubic-bezier(.12,.7,.25,1.06)`;
    col.style.transform = `translateX(-50%) translateY(-${col.dataset.len * 1.1}em)`;
  });
  const done = () => reveal(item);
  if (cols.length) cols[cols.length - 1].addEventListener('transitionend', done, { once: true });
  else done();
});

function reveal(item) {
  S.spinning = false;
  S.lastItem = item;
  S.plates.push(item);
  const t = tierOf(item.tier), c = countryOf(item.c);
  const reg = regionName(c, item.text);
  $('#stage').style.setProperty('--c', t.color);
  $('#big').classList.add('won');
  $('#outcome').innerHTML = `
    <div class="tier">${t.name}</div>
    <div class="meta">${c.name}${reg ? ' · ' + reg : ''} · уже в гараже</div>
    <div class="val">${fmt(item.value)}</div>`;
  $('#sellNow').textContent = `Продать за ${fmt(item.value)}`;
  $('#sellNow').classList.remove('hidden');
  renderSpinButton(); renderCountries(); renderInventory(); renderPerks(); renderHeader();
  if (tierIdx(item.tier) >= tierIdx('legendary')) toast(`${t.name} номер! ${item.text.replace('|', ' ')} — ${fmt(item.value)}`, t.color);
}

// ---------- гараж ----------
function renderInventory() {
  const list0 = S.plates;
  $('#invCount').textContent = list0.length ? ` ${list0.length}` : '';
  $('#invTotal').innerHTML = `${list0.length} шт. · <small>стоимость</small> ${fmt(worth())}`;
  $('#sellCommon').disabled = !list0.some(i => i.tier === 'common' && !S.listed.has(i.id));

  const f = $('#filter'), cur = f.value || 'all';
  const present = COUNTRIES.filter(c => list0.some(i => i.c === c.id));
  f.innerHTML = `<option value="all">Все страны</option>` + present.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  f.value = present.some(c => c.id === cur) ? cur : 'all';

  const k = S.contract;
  $('#contractBar').classList.toggle('hidden', !k);
  $('#contractBtn').classList.toggle('primary', !!k);
  if (k) {
    const tier = k.size ? tierOf(S.plates.find(p => k.has(p.id))?.tier) : null;
    const next = tier ? TIERS[tierIdx(tier.id) + 1] : null;
    $('#contractText').textContent = tier
      ? `Выбрано ${k.size}/10 · ${tier.name} → ${next.name}`
      : 'Выбери 10 номеров одной редкости';
    $('#contractGo').disabled = k.size !== 10;
  }
  const kTier = k?.size ? S.plates.find(p => k.has(p.id))?.tier : null;

  const sort = $('#sort').value;
  const list = list0.filter(i => f.value === 'all' || i.c === f.value).sort((a, b) =>
    sort === 'new' ? b.ts - a.ts : sort === 'cheap' ? a.value - b.value : b.value - a.value);
  $('#grid').innerHTML = list.length ? list.map(i => {
    const t = tierOf(i.tier), c = countryOf(i.c);
    const reg = regionName(c, i.text);
    const price = S.listed.get(i.id);
    let foot;
    if (k) {
      foot = `<span class="price">${fmt(i.value)}</span><span class="seller">${k.has(i.id) ? 'выбран' : ''}</span>`;
    } else if (price) {
      foot = `<span class="listed">На рынке за ${fmt(price)}</span><button class="btn" data-unlist="${i.id}">Снять</button>`;
    } else if (S.listing === i.id) {
      foot = `<form data-list="${i.id}"><input class="field" type="number" min="1" step="1" value="${i.value * 2}" required><button class="btn primary">Выставить</button><button class="btn" type="button" data-listcancel>×</button></form>`;
    } else {
      foot = `<span class="price">${fmt(i.value)}</span><span style="display:flex;gap:6px"><button class="btn" data-tomarket="${i.id}">На рынок</button><button class="btn" data-sell="${i.id}">Продать</button></span>`;
    }
    const blocked = k && (price || i.tier === 'mythic' || (kTier && i.tier !== kTier && !k.has(i.id)));
    const cls = k ? (k.has(i.id) ? 'pick sel' : blocked ? 'dim' : 'pick') : '';
    return `<div class="item ${cls}" style="--c:${t.color}" ${k && !blocked ? `data-pick="${i.id}"` : ''}>
      ${plateBox(i, 24)}
      <div class="info"><span class="tier">${t.name}</span><span class="region">${c.name}${reg ? ' · ' + reg : ''}</span></div>
      <div class="foot">${foot}</div>
    </div>`;
  }).join('') : `<div class="empty">Гараж пуст. Покрути номера — они попадут сюда.</div>`;
  fit($('#grid'));
}

const sell = act(async ids => {
  const total = await rpc('sell_plates', { p_ids: ids });
  const set = new Set(ids);
  S.plates = S.plates.filter(p => !set.has(p.id));
  S.profile.balance += total;
  if (S.lastItem && set.has(S.lastItem.id)) $('#sellNow').classList.add('hidden');
  if (total) toast(`Продано на ${fmt(total)}`, '#3ccf7a');
  renderHeader(true); renderSpinButton(); renderInventory(); renderPerks();
});

const needMember = () => {
  if (S.member) return true;
  toast('Торговать можно после входа через Google или Telegram');
  openAccount();
  return false;
};

const signContract = act(async () => {
  const ids = [...S.contract];
  const res = await callFn('contract', { ids });
  const set = new Set(ids);
  S.plates = S.plates.filter(p => !set.has(p.id));
  const item = { ...res.item, ts: Date.now() };
  S.plates.push(item);
  S.contract = null;
  renderInventory(); renderPerks(); renderHeader();
  const t = tierOf(item.tier);
  openModal(`<h3>Контракт подписан</h3><p>Ты отдал 10 номеров и получил:</p>
    <div class="big fit" data-size="64" style="min-height:160px;--c:${t.color}">${plateHTML(item.c, item.text)}</div>
    <div class="outcome" style="text-align:center;--c:${t.color}"><div class="tier">${t.name}</div><div class="val">${fmt(item.value)}</div></div>`);
});

// ---------- рынок ----------
async function loadMarket() {
  const { data, error } = await sb.from('listings')
    .select('price, created_at, seller, plate:plates!listings_plate_id_fkey(*), seller_profile:profiles!listings_seller_fkey(nick)')
    .order('created_at', { ascending: false }).limit(300);
  if (error) throw new Error(error.message);
  S.market = data.filter(l => l.plate).map(l => ({ ...toItem(l.plate), price: l.price, seller: l.seller, nick: l.seller_profile?.nick || '—', listedAt: Date.parse(l.created_at) }));
}
function renderMarket() {
  const f = $('#mFilter'), cur = f.value || 'all';
  const present = COUNTRIES.filter(c => S.market.some(i => i.c === c.id));
  f.innerHTML = `<option value="all">Все страны</option>` + present.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  f.value = present.some(c => c.id === cur) ? cur : 'all';
  const sort = $('#mSort').value;
  const list = S.market.filter(i => f.value === 'all' || i.c === f.value).sort((a, b) =>
    sort === 'cheap' ? a.price - b.price : sort === 'value' ? b.value - a.value : b.listedAt - a.listedAt);
  $('#marketTotal').innerHTML = `${S.market.length} ${plural(S.market.length, 'номер', 'номера', 'номеров')} на продаже · <small>комиссия ${MARKET_FEE * 100}% с продавца</small>`;
  $('#mGrid').innerHTML = list.length ? list.map(i => {
    const t = tierOf(i.tier), c = countryOf(i.c), mine = i.seller === S.uid;
    return `<div class="item" style="--c:${t.color}">
      ${plateBox(i, 24)}
      <div class="info"><span class="tier">${t.name}</span><span class="region">${c.name} · номинал ${fmt(i.value)}</span></div>
      <div class="seller">Продавец: ${mine ? 'ты' : `<button data-player="${i.seller}">${esc(i.nick)}</button>`}</div>
      <div class="foot"><span class="price">${fmt(i.price)}</span>
        ${mine ? `<button class="btn" data-unlist="${i.id}">Снять</button>` : `<button class="btn primary" data-buy="${i.id}" data-price="${i.price}">Купить</button>`}</div>
    </div>`;
  }).join('') : `<div class="empty">На рынке пока пусто. Выстави свой номер из гаража — кнопка «На рынок».</div>`;
  fit($('#mGrid'));
}

// ---------- игроки и обмены ----------
async function loadPlayers() {
  S.board = await rpc('leaderboard');
  const { data } = await sb.from('offers').select('*').eq('status', 'open').order('created_at', { ascending: false });
  S.offers = data || [];
  const plateIds = [...new Set(S.offers.flatMap(o => [...o.give_plates, ...o.want_plates]))];
  const userIds = [...new Set(S.offers.flatMap(o => [o.from_id, o.to_id]))];
  const [pl, pr] = await Promise.all([
    plateIds.length ? sb.from('plates').select('*').in('id', plateIds) : { data: [] },
    userIds.length ? sb.from('profiles').select('id, nick').in('id', userIds) : { data: [] },
  ]);
  S.offerPlates = new Map((pl.data || []).map(r => [r.id, toItem(r)]));
  S.nicks = new Map((pr.data || []).map(r => [r.id, r.nick]));
}
function offerSide(title, ids, money, owner) {
  const parts = ids.map(id => {
    const p = S.offerPlates.get(id);
    return p && p.owner === owner ? `<div class="pv fit" data-size="14">${plateHTML(p.c, p.text)}</div>` : `<div class="gone">номер уже недоступен</div>`;
  });
  if (money) parts.push(`<div class="money">${fmt(money)}</div>`);
  return `<div class="oside"><h5>${title}</h5>${parts.join('') || '<small>ничего</small>'}</div>`;
}
function renderPlayers() {
  $('#offers').innerHTML = S.offers.length ? S.offers.map(o => {
    const incoming = o.to_id === S.uid;
    const other = esc(S.nicks.get(incoming ? o.from_id : o.to_id) || '—');
    return `<div class="offer">
      <div class="who">${incoming ? `<b>${other}</b> предлагает тебе обмен` : `Ты предложил обмен игроку <b>${other}</b>`}</div>
      <div class="sides">
        ${offerSide(incoming ? 'Ты получишь' : 'Ты отдаёшь', o.give_plates, o.give_money, o.from_id)}
        ${offerSide(incoming ? 'Ты отдашь' : 'Ты получишь', o.want_plates, o.want_money, o.to_id)}
      </div>
      <div class="row2" style="margin:0">${incoming
        ? `<button class="btn primary" data-accept="${o.id}">Принять</button><button class="btn" data-decline="${o.id}">Отклонить</button>`
        : `<button class="btn" data-cancel="${o.id}">Отменить</button>`}</div>
    </div>`;
  }).join('') : `<div class="empty">Обменов нет. Открой игрока в рейтинге ниже и предложи ему обмен.</div>`;
  $('#board').innerHTML = S.board.length ? S.board.map((r, i) => `
    <button class="${r.id === S.uid ? 'me' : ''}" data-player="${r.id}">
      <span class="rank">${i + 1}</span><span class="n">${esc(r.nick)}${r.id === S.uid ? ' (ты)' : ''}</span>
      <small>${r.plates} шт.</small><span class="w">${fmt(r.worth)}</span>
    </button>`).join('') : `<div class="empty">Пока никого</div>`;
  fit($('#offers'));
  renderHeader();
}

const openPlayer = act(async id => {
  if (id === S.uid) { switchTab('inv'); return; }
  const [{ data: prof }, { data: rows }] = await Promise.all([
    sb.from('profiles').select('id, nick').eq('id', id).single(),
    sb.from('plates').select('*').eq('owner', id),
  ]);
  const plates = (rows || []).map(toItem).sort((a, b) => b.value - a.value);
  const total = plates.reduce((s, p) => s + p.value, 0);
  openModal(`<h3>${esc(prof.nick)}</h3><p>${plates.length} ${plural(plates.length, 'номер', 'номера', 'номеров')} · гараж стоит ${fmt(total)}</p>
    <div class="row2"><button class="btn primary" id="tradeBtn">Предложить обмен</button></div>
    <div class="grid">${plates.map(p => `<div class="item" style="--c:${tierOf(p.tier).color}">${plateBox(p, 20)}
      <div class="info"><span class="tier">${tierOf(p.tier).name}</span><span class="region">${fmt(p.value)}</span></div></div>`).join('') || '<div class="empty">Пустой гараж</div>'}</div>`);
  $('#tradeBtn').onclick = () => { if (needMember()) openTrade(prof, plates); };
});

function openTrade(prof, theirs) {
  const mine = S.plates.filter(p => !S.listed.has(p.id)).sort((a, b) => b.value - a.value);
  const give = new Set(), want = new Set();
  const miniList = (list, set, side) => list.map(p => `
    <button class="m ${set.has(p.id) ? 'sel' : ''}" style="--c:${tierOf(p.tier).color}" data-side="${side}" data-id="${p.id}">
      <span class="pv fit" data-size="13">${plateHTML(p.c, p.text)}</span>
      <span>${tierOf(p.tier).name}<small>${fmt(p.value)}</small></span>
    </button>`).join('') || '<div class="empty" style="padding:20px">Нет номеров</div>';
  const draw = () => {
    $('#modalBody').innerHTML = `<h3>Обмен с ${esc(prof.nick)}</h3>
      <p>Выбери, что отдаёшь и что хочешь получить. Можно добавить деньги с любой стороны. ${esc(prof.nick)} увидит предложение во вкладке «Игроки».</p>
      <div class="cols">
        <div><h4>Ты отдаёшь · ${give.size}</h4><div class="mini">${miniList(mine, give, 'give')}</div>
          <input class="field" id="giveMoney" type="number" min="0" step="1" placeholder="+ деньги, ₴" style="width:100%;margin-top:8px"></div>
        <div><h4>Ты получаешь · ${want.size}</h4><div class="mini">${miniList(theirs, want, 'want')}</div>
          <input class="field" id="wantMoney" type="number" min="0" step="1" placeholder="+ деньги, ₴" style="width:100%;margin-top:8px"></div>
      </div>
      <div class="row2" style="margin-top:16px"><button class="btn primary" id="sendOffer">Отправить предложение</button></div>`;
    fit($('#modalBody'));
    $('#modalBody').querySelectorAll('.m').forEach(b => b.onclick = () => {
      const set = b.dataset.side === 'give' ? give : want;
      set.has(b.dataset.id) ? set.delete(b.dataset.id) : set.size < 10 && set.add(b.dataset.id);
      const gm = $('#giveMoney').value, wm = $('#wantMoney').value;
      draw();
      $('#giveMoney').value = gm; $('#wantMoney').value = wm;
    });
    $('#sendOffer').onclick = act(async () => {
      await rpc('create_offer', {
        p_to: prof.id, p_give: [...give], p_want: [...want],
        p_give_money: Math.max(0, Math.floor(+$('#giveMoney').value || 0)),
        p_want_money: Math.max(0, Math.floor(+$('#wantMoney').value || 0)),
      });
      closeModal();
      toast('Предложение отправлено', '#3ccf7a');
      switchTab('players');
    });
  };
  draw();
}

// ---------- коллекции ----------
const isComplete = id => { const p = collectionProgress(id, S.plates); return p.have >= p.need; };
function renderColls() {
  $('#colls').innerHTML = COLLECTIONS.map(col => {
    const p = collectionProgress(col.id, S.plates);
    const got = S.claims.has(col.id), done = p.have >= p.need;
    const prog = col.id === 'rich' ? `${fmt(p.have)} / ${fmt(p.need)}` : `${p.have} / ${p.need}`;
    return `<div class="coll ${got ? 'done' : ''}">
      <h4>${col.name}</h4><p>${col.desc}</p>
      <div class="bar"><i style="width:${Math.round(p.have / p.need * 100)}%"></i></div>
      <div class="foot"><b>${prog}</b>${got ? `<span class="got">Награда получена</span>`
        : `<button class="btn ${done ? 'primary' : ''}" data-claim="${col.id}" ${done ? '' : 'disabled'}>+${fmt(col.reward)}</button>`}</div>
    </div>`;
  }).join('');
  renderHeader();
}

// ---------- аккаунт ----------
function openAccount() {
  const tgReady = !!S.tgBot;
  openModal(`<h3>${esc(S.profile.nick)}</h3>
    <p>${S.member
      ? `Ты вошёл${S.provider ? ' через ' + S.provider : ''}. Номера и баланс хранятся на сервере, можно торговать.`
      : 'Ты играешь как гость: прогресс привязан к этому браузеру, торговать нельзя. Войди — гараж и баланс сохранятся, откроются рынок и обмены.'}</p>
    <div class="row2"><input class="field" id="nickInput" maxlength="20" value="${esc(S.profile.nick)}"><button class="btn" id="nickSave">Сменить ник</button></div>
    ${S.member ? `<div class="login"><button class="btn" id="logout">Выйти</button></div>` : `
    <div class="login">
      <button class="btn primary" id="googleBtn" ${S.google ? '' : 'disabled'}>Войти через Google</button>
      <div id="tgBox" style="display:flex;justify-content:center">${tgReady ? '' : '<button class="btn" disabled style="width:100%">Войти через Telegram</button>'}</div>
      ${S.google && tgReady ? '' : '<div class="note">Вход через Google и Telegram скоро заработает — пока можно играть гостем.</div>'}
    </div>`}`);
  $('#nickSave').onclick = act(async () => {
    S.profile.nick = await rpc('set_nick', { p_nick: $('#nickInput').value });
    renderHeader(); closeModal(); toast('Ник сохранён', '#3ccf7a');
  });
  if (S.member) {
    $('#logout').onclick = act(async () => { await sb.auth.signOut(); location.reload(); });
    return;
  }
  $('#googleBtn').onclick = act(async () => {
    const { error } = await sb.auth.linkIdentity({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    if (error) throw new Error(error.message);
  });
  if (tgReady) {
    const s = document.createElement('script');
    s.async = true; s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.dataset.telegramLogin = S.tgBot; s.dataset.size = 'large'; s.dataset.radius = '10';
    s.dataset.onauth = 'onTelegramAuth(user)'; s.dataset.requestAccess = 'write';
    $('#tgBox').append(s);
  }
}
window.onTelegramAuth = act(async user => {
  const { token_hash } = await callFn('tg-auth', { tg: user });
  const { error } = await sb.auth.verifyOtp({ token_hash, type: 'magiclink' });
  if (error) throw new Error(error.message);
  location.reload();
});

// ---------- модалка, вкладки ----------
function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); fit($('#modalBody')); }
function closeModal() { $('#modal').classList.add('hidden'); }
$('#modalX').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

let tab = 'spin';
const switchTab = act(async name => {
  tab = name;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  for (const t of ['spin', 'inv', 'market', 'players', 'colls']) $(`#tab-${t}`).classList.toggle('hidden', t !== name);
  if (name === 'market') { $('#mGrid').innerHTML = '<div class="loading">Загружаю рынок…</div>'; await loadMarket(); renderMarket(); }
  if (name === 'players') { $('#board').innerHTML = '<div class="loading">Загружаю…</div>'; await loadPlayers(); renderPlayers(); }
  if (name === 'colls') renderColls();
  if (name === 'inv') renderInventory();
  fit();
});

// ---------- события ----------
document.addEventListener('click', act(async e => {
  const t = e.target.closest('button, [data-pick]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return switchTab(d.tab);
  if (d.country && !S.spinning) {
    S.country = d.country; localStorage.setItem('nomernoy-country', S.country);
    renderCountries(); renderStage(); renderLegend();
  }
  if (d.pick) {
    const k = S.contract;
    k.has(d.pick) ? k.delete(d.pick) : k.size < 10 && k.add(d.pick);
    renderInventory();
  }
  if (d.sell) await sell([d.sell]);
  if (d.tomarket && needMember()) { S.listing = d.tomarket; renderInventory(); $('#grid form input')?.focus(); }
  if ('listcancel' in d) { S.listing = null; renderInventory(); }
  if (d.unlist) {
    await rpc('unlist_plate', { p_plate: d.unlist });
    S.listed.delete(d.unlist);
    S.market = S.market.filter(i => i.id !== d.unlist);
    renderInventory(); if (tab === 'market') renderMarket();
    toast('Снято с продажи');
  }
  if (d.buy && needMember()) {
    await rpc('buy_listing', { p_plate: d.buy });
    toast(`Куплено за ${fmt(+d.price)} — номер в гараже`, '#3ccf7a');
    await loadMe(); await loadMarket();
    renderMarket(); renderHeader(true); renderInventory(); renderPerks(); renderSpinButton();
  }
  if (d.player) { closeModal(); await openPlayer(d.player); }
  if (d.accept || d.decline) {
    const r = await rpc('respond_offer', { p_offer: d.accept || d.decline, p_accept: !!d.accept });
    toast(r === 'accepted' ? 'Обмен состоялся' : r === 'declined' ? 'Предложение отклонено' : 'Обмен не состоялся: номера или деньги уже недоступны',
      r === 'accepted' ? '#3ccf7a' : undefined);
    await loadMe(); await loadPlayers();
    renderPlayers(); renderHeader(true); renderInventory(); renderPerks(); renderSpinButton();
  }
  if (d.cancel) { await rpc('cancel_offer', { p_offer: d.cancel }); await loadPlayers(); renderPlayers(); }
  if (d.claim) {
    const amt = await rpc('claim_collection', { p_id: d.claim });
    S.claims.add(d.claim); S.profile.balance += amt;
    toast(`Коллекция собрана: +${fmt(amt)}`, '#3ccf7a');
    renderColls(); renderHeader(true); renderSpinButton();
  }
}));
document.addEventListener('submit', act(async e => {
  const form = e.target.closest('[data-list]');
  if (!form) return;
  e.preventDefault();
  const price = Math.floor(+form.querySelector('input').value);
  await rpc('list_plate', { p_plate: form.dataset.list, p_price: price });
  S.listed.set(form.dataset.list, price); S.listing = null;
  renderInventory();
  toast(`Выставлено на рынок за ${fmt(price)}`, '#3ccf7a');
}));
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && tab === 'spin' && $('#modal').classList.contains('hidden') && !['INPUT', 'SELECT'].includes(e.target.tagName)) {
    e.preventDefault(); spin();
  }
});
$('#spinBtn').onclick = spin;
$('#sellNow').onclick = () => S.lastItem && sell([S.lastItem.id]);
$('#sort').onchange = renderInventory;
$('#filter').onchange = renderInventory;
$('#mSort').onchange = renderMarket;
$('#mFilter').onchange = renderMarket;
$('#sellCommon').onclick = () => sell(S.plates.filter(p => p.tier === 'common' && !S.listed.has(p.id)).map(p => p.id));
$('#contractBtn').onclick = () => { S.contract = S.contract ? null : new Set(); S.listing = null; renderInventory(); };
$('#contractCancel').onclick = () => { S.contract = null; renderInventory(); };
$('#contractGo').onclick = signContract;
$('#accBtn').onclick = () => S.profile && openAccount();
$('#dailyBtn').onclick = act(async () => {
  const r = await rpc('claim_daily');
  S.profile.balance += r.amount; S.profile.daily_streak = r.streak; S.profile.daily_last = kyivDate(new Date());
  toast(`Бонус дня ${r.streak}: +${fmt(r.amount)}`, '#ffd500');
  renderHeader(true); renderPerks(); renderSpinButton();
});
$('#rentBtn').onclick = act(async () => {
  const amt = await rpc('claim_rent');
  await loadMe();
  toast(`Аренда: +${fmt(amt)}`, '#3ccf7a');
  renderHeader(true); renderPerks(); renderSpinButton();
});

// ---------- старт ----------
$('#logo').innerHTML = `${plateHTML('ua', 'KA 0001 KA')}<span class="word">НОМЕРНОЙ</span>`;
renderCountries(); renderStage(); renderLegend();

async function boot() {
  // ошибка после возврата с Google (например, этот Google уже привязан к другому игроку)
  const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  const oauthErr = params.get('error_description');
  if (oauthErr) history.replaceState(null, '', location.pathname);

  let { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const { data, error } = await sb.auth.signInAnonymously();
    if (error) throw new Error('Не получилось войти: ' + error.message);
    session = data.session;
  }
  const u = session.user;
  S.uid = u.id;
  S.member = !u.is_anonymous;
  S.provider = (u.app_metadata?.providers || []).includes('google') ? 'Google' : u.user_metadata?.provider === 'telegram' ? 'Telegram' : '';
  fetch(`${SUPABASE_URL}/auth/v1/settings`, { headers: { apikey: SUPABASE_KEY } })
    .then(r => r.json()).then(s => { S.google = !!s.external?.google; }).catch(() => {});
  callFn('tg-auth', { config: true }).then(r => { S.tgBot = r.bot; }).catch(() => {});
  await loadMe();
  renderHeader(); renderPerks(); renderSpinButton(); renderInventory();
  if (oauthErr) {
    if (/already/i.test(oauthErr)) {
      openModal(`<h3>Этот Google уже в игре</h3><p>К этому Google-аккаунту привязан другой игрок. Войти в него? Номера текущего гостя останутся в этом браузере недоступными.</p>
        <div class="row2"><button class="btn primary" id="googleSwitch">Войти в тот аккаунт</button></div>`);
      $('#googleSwitch').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    } else toast(oauthErr, '#ff3d3d');
  }
}
act(boot)();
document.fonts.ready.then(() => fit());
addEventListener('resize', () => { if (!S.spinning) fit(); });
$('.country.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
setInterval(renderPerks, 30000);
document.addEventListener('visibilitychange', act(async () => {
  if (document.visibilityState !== 'visible' || !S.uid || S.spinning) return;
  await loadMe(); renderHeader(); renderPerks(); renderSpinButton(); renderInventory();
}));
</script>
</body>
</html>
